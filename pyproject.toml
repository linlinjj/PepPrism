[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pepprism"
version = "0.1.0"
description = "PepPrism: An Interpretable Multi-Scale Biophysical-Sequence Fusion Framework for Therapeutic Peptide Discovery and Rational Design"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Junjie Lin", email = "1516640951@qq.com"}
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "torch>=2.2",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.6",
    "typer>=0.12",
    "requests>=2.31",
    "biopython>=1.83",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
pepprism = "pepprism.cli:main"

[tool.setuptools.packages.find]
include = ["pepprism*"]

[tool.setuptools.package-data]
"pepprism.web" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
